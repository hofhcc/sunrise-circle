<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Residents | Sunrise Circle</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f8f5;
      color: #26343a;
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 36px 28px 60px;
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .sun-logo {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: #f7b733;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .brand h1 {
      font-size: 30px;
      margin-bottom: 4px;
    }

    .brand p {
      color: #697477;
      font-size: 16px;
    }

    .back-button {
      text-decoration: none;
      color: #33483a;
      background: white;
      border: 1px solid #dde2dc;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 600;
    }

    /* MAIN CARD */
    .card {
      background: white;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 26px;
    }

    .card-header h2 {
      font-size: 25px;
    }

    .add-button {
      border: none;
      background: #33483a;
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* RESIDENT LIST */
    .resident-row {
      display: grid;
      grid-template-columns: 60px 1.4fr 1fr 120px;
      gap: 20px;
      align-items: center;
      padding: 20px 8px;
      border-bottom: 1px solid #ecefeb;
    }

    .resident-row:last-child {
      border-bottom: none;
    }

    .resident-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #f1f3ef;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 23px;
    }

    .resident-name {
      font-weight: 700;
      font-size: 17px;
      margin-bottom: 5px;
    }

    .resident-phone,
    .resident-time {
      color: #697477;
      font-size: 14px;
    }

    .status {
      display: inline-block;
      margin-top: 5px;
      padding: 5px 10px;
      border-radius: 20px;
      background: #edf4ed;
      color: #49634e;
      font-size: 12px;
      font-weight: 700;
    }

    .edit-button {
      border: none;
      background: #eef0eb;
      color: #33483a;
      padding: 10px 16px;
      border-radius: 9px;
      font-weight: 600;
      cursor: pointer;
    }

    .empty-message {
      text-align: center;
      padding: 50px 20px;
      color: #7a8385;
    }

    .footer {
      text-align: center;
      margin-top: 28px;
      color: #879092;
      font-size: 13px;
    }

    @media (max-width: 750px) {
      .resident-row {
        grid-template-columns: 50px 1fr;
      }

      .resident-details,
      .resident-actions {
        grid-column: 2;
      }

      .header {
        align-items: flex-start;
        gap: 20px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="header">

      <div class="brand">
        <div class="sun-logo">☀️</div>

        <div>
          <h1>Sunrise Circle</h1>
          <p>Resident Management</p>
        </div>
      </div>

      <a href="index.html" class="back-button">
        ← Dashboard
      </a>

    </header>


    <section class="card">

      <div class="card-header">

        <div>
          <h2>Residents</h2>
        </div>

        <button
          type="button"
          class="add-button"
          id="addResidentButton"
        >
          + Add Resident
        </button>

      </div>


      <div id="residentList">

        <div class="empty-message">
          Loading residents...
        </div>

      </div>

    </section>


    <div class="footer">
      Hearts of Hope Community Care • Sunrise Circle Wellness Program
    </div>

  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://yagrfbsgdyasjluankhj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_x7Hn1RvHSa-oQBvjjcBb7A_nTV32rAd";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  async function checkStaffSession() {
    const {
      data: { session },
      error
    } = await supabaseClient.auth.getSession();

    if (error || !session) {
      window.location.href = "index.html";
      return false;
    }

    return true;
  }

  async function loadResidents() {
    const { data, error } = await supabaseClient
      .from("residents")
      .select(
        "id, first_name, last_name, phone_number, preferred_call_time, active"
      )
      .order("first_name", { ascending: true });

    const residentList = document.getElementById("residentList");

    if (error) {
      console.error("Residents failed:", error);
      residentList.innerHTML = `
        <div class="empty-message">
          Residents could not be loaded.
        </div>
      `;
      return;
    }

    residentList.innerHTML = "";

    data.forEach((resident) => {
      const fullName =
        `${resident.first_name || ""} ${resident.last_name || ""}`.trim();

      const statusText = resident.active ? "Active" : "Inactive";

      residentList.innerHTML += `
        <div class="resident-row">

          <div class="resident-icon">👤</div>

          <div>
            <div class="resident-name">${fullName}</div>
            <div class="resident-phone">${resident.phone_number || ""}</div>
          </div>

          <div class="resident-details">
            <div class="resident-time">
              Preferred call time:
              ${resident.preferred_call_time || "Not set"}
            </div>

            <span class="status">
              ${statusText}
            </span>
          </div>

          <div class="resident-actions">
            <button
              type="button"
              class="edit-button"
              data-resident-id="${resident.id}"
            >
              Edit
            </button>
          </div>

        </div>
      `;
    });
  }

  async function startResidentsPage() {
    const signedIn = await checkStaffSession();

    if (!signedIn) return;

    await loadResidents();
  }

  startResidentsPage();
</script>
</body>
</html>
