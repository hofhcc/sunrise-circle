<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Residents | Sunrise Circle</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f8f5;
      color: #26343a;
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 36px 28px 60px;
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .sun-logo {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: #f7b733;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .brand h1 {
      font-size: 30px;
      margin-bottom: 4px;
    }

    .brand p {
      color: #697477;
      font-size: 16px;
    }

    .back-button {
      text-decoration: none;
      color: #33483a;
      background: white;
      border: 1px solid #dde2dc;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 600;
    }

    /* MAIN CARD */
    .card {
      background: white;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 26px;
    }

    .card-header h2 {
      font-size: 25px;
    }

    .add-button {
      border: none;
      background: #33483a;
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* RESIDENT LIST */
    .resident-row {
      display: grid;
      grid-template-columns: 60px 1.4fr 1fr 120px;
      gap: 20px;
      align-items: center;
      padding: 20px 8px;
      border-bottom: 1px solid #ecefeb;
    }

    .resident-row:last-child {
      border-bottom: none;
    }

    .resident-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #f1f3ef;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 23px;
    }

    .resident-name {
      font-weight: 700;
      font-size: 17px;
      margin-bottom: 5px;
    }

    .resident-phone,
    .resident-time {
      color: #697477;
      font-size: 14px;
    }

    .status {
      display: inline-block;
      margin-top: 5px;
      padding: 5px 10px;
      border-radius: 20px;
      background: #edf4ed;
      color: #49634e;
      font-size: 12px;
      font-weight: 700;
    }

    .edit-button {
      border: none;
      background: #eef0eb;
      color: #33483a;
      padding: 10px 16px;
      border-radius: 9px;
      font-weight: 600;
      cursor: pointer;
    }

    .empty-message {
      text-align: center;
      padding: 50px 20px;
      color: #7a8385;
    }

    .footer {
      text-align: center;
      margin-top: 28px;
      color: #879092;
      font-size: 13px;
    }

    @media (max-width: 750px) {
      .resident-row {
        grid-template-columns: 50px 1fr;
      }

      .resident-details,
      .resident-actions {
        grid-column: 2;
      }

      .header {
        align-items: flex-start;
        gap: 20px;
      }
    }

    .modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(25, 38, 43, 0.45);
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 1000;
}

.modal-overlay.open {
  display: flex;
}

.modal-card {
  width: 100%;
  max-width: 560px;
  background: white;
  border-radius: 20px;
  padding: 28px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
}

.modal-card h2 {
  margin: 0 0 6px;
  font-size: 24px;
}

.modal-subtitle {
  margin: 0 0 24px;
  color: #6b7779;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.form-field {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.form-field.full-width {
  grid-column: 1 / -1;
}

.form-field label {
  font-weight: 700;
  font-size: 14px;
}

.form-field input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid #d9dfdb;
  border-radius: 10px;
  font: inherit;
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 4px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 26px;
}

.cancel-button,
.save-button {
  border: 0;
  border-radius: 10px;
  padding: 11px 18px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}

.cancel-button {
  background: #eef1ed;
  color: #34453d;
}

.save-button {
  background: #2f503f;
  color: white;
}

@media (max-width: 650px) {
  .form-grid {
    grid-template-columns: 1fr;
  }

  .form-field.full-width {
    grid-column: auto;
  }
}
  </style>
</head>

<body>

  <main class="page">

    <header class="header">

      <div class="brand">
        <div class="sun-logo">☀️</div>

        <div>
          <h1>Sunrise Circle</h1>
          <p>Resident Management</p>
        </div>
      </div>

      <a href="index.html" class="back-button">
        ← Dashboard
      </a>

    </header>


    <section class="card">

      <div class="card-header">

        <div>
          <h2>Residents</h2>
        </div>

        <button
          type="button"
          class="add-button"
          id="addResidentButton"
        >
          + Add Resident
        </button>

      </div>


      <div id="residentList">

        <div class="empty-message">
          Loading residents...
        </div>

      </div>

    </section>

<div id="residentFormPanel" class="modal-overlay">
  <div class="modal-card">
  <h2 id="residentFormTitle">Add Resident</h2>

  <form id="residentForm">
    <input type="hidden" id="residentId">

    <div class="form-grid">
      <div class="form-field">
        <label for="firstName">First name</label>
        <input type="text" id="firstName" required>
      </div>

      <div class="form-field">
        <label for="lastName">Last name</label>
        <input type="text" id="lastName" required>
      </div>

      <div class="form-field">
        <label for="phoneNumber">Phone number</label>
        <input
          type="tel"
          id="phoneNumber"
          placeholder="+14165551234"
          required
        >
      </div>

      <div class="form-field">
        <label for="preferredCallTime">Preferred call time</label>
        <input type="time" id="preferredCallTime">
      </div>

      <div class="form-field full-width">
        <label class="checkbox-row">
          <input type="checkbox" id="residentActive" checked>
          Active resident
        </label>
      </div>
    </div>

    <div id="residentFormMessage" class="form-message"></div>

    <div class="modal-actions">
      <button
        type="button"
        id="cancelResidentButton"
        class="cancel-button"
      >
        Cancel
      </button>

      <button
        type="submit"
        class="save-button"
      >
        Save Resident
      </button>
    </div>
  </form>
</div>
    </div>
    <div class="footer">
      Hearts of Hope Community Care • Sunrise Circle Wellness Program
    </div>

  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://vaqrfbsgdyasjluankhj.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_x7HnlRvHSa-oQBvjicBb7A_nTV32rAd";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  async function checkStaffSession() {
    const {
      data: { session },
      error
    } = await supabaseClient.auth.getSession();

    if (error || !session) {
  console.log("Residents auth check:", { error, session });

  document.getElementById("residentList").innerHTML = `
    <div class="empty-message">
      Staff session not found.
    </div>
  `;

  return false;
    }

    return true;
  }

  async function loadResidents() {
    const { data, error } = await supabaseClient
      .from("residents")
      .select(
        "id, first_name, last_name, phone_number, preferred_call_time, active"
      )
      .order("first_name", { ascending: true });

    const residentList = document.getElementById("residentList");

    if (error) {
  console.error("Residents failed:", error);

  residentList.innerHTML = `
    <div class="empty-message">
      Residents could not be loaded.<br><br>
      <strong>${error.message}</strong>
    </div>
  `;

  return;
}


    residentList.innerHTML = "";

    data.forEach((resident) => {
      const fullName =
        `${resident.first_name || ""} ${resident.last_name || ""}`.trim();

      const statusText = resident.active ? "Active" : "Inactive";

      residentList.innerHTML += `
        <div class="resident-row">

          <div class="resident-icon">👤</div>

          <div>
            <div class="resident-name">${fullName}</div>
            <div class="resident-phone">${resident.phone_number || ""}</div>
          </div>

          <div class="resident-details">
            <div class="resident-time">
              Preferred call time:
              ${resident.preferred_call_time || "Not set"}
            </div>

            <span class="status">
              ${statusText}
            </span>
          </div>

          <div class="resident-actions">
            <button
              type="button"
              class="edit-button"
              data-resident-id="${resident.id}"
onclick="editResident(${resident.id})"
            >
              Edit
            </button>
          </div>

        </div>
      `;
    });
  }
async function editResident(residentId) {
  const { data, error } = await supabaseClient
    .from("residents")
    .select("id, first_name, last_name, phone_number, preferred_call_time, active")
    .eq("id", residentId)
    .single();

  if (error) {
    console.error("Could not load resident:", error);
    alert("We couldn't load this resident. Please try again.");
    return;
  }

  document.getElementById("residentId").value = data.id;
  document.getElementById("firstName").value = data.first_name || "";
  document.getElementById("lastName").value = data.last_name || "";
  document.getElementById("phoneNumber").value = data.phone_number || "";
  document.getElementById("preferredCallTime").value =
    data.preferred_call_time || "";
  document.getElementById("residentActive").checked = data.active;

  document.getElementById("residentFormTitle").textContent = "Edit Resident";

  document
    .getElementById("residentFormPanel")
    .classList.add("open");
}
  async function startResidentsPage() {
  const signedIn = await checkStaffSession();

  if (!signedIn) return;

  await loadResidents();
}

  document
  .getElementById("addResidentButton")
  .addEventListener("click", () => {
    document
      .getElementById("residentFormPanel")
      .classList.add("open");
  });

  document
  .getElementById("cancelResidentButton")
  .addEventListener("click", () => {
    document
      .getElementById("residentFormPanel")
      .classList.remove("open");
  });
  document
  .getElementById("residentForm")
  .addEventListener("submit", async (event) => {
    event.preventDefault();

    const firstName = document.getElementById("firstName").value.trim();
    const lastName = document.getElementById("lastName").value.trim();
    const phoneNumber = document.getElementById("phoneNumber").value.trim();
    const preferredCallTime =
      document.getElementById("preferredCallTime").value;
    const active = document.getElementById("residentActive").checked;

    const message = document.getElementById("residentFormMessage");

    message.textContent = "Saving resident...";

    const residentId = document.getElementById("residentId").value;

let query;

if (residentId) {
  query = supabaseClient
    .from("residents")
    .update({
      first_name: firstName,
      last_name: lastName,
      phone_number: phoneNumber,
      preferred_call_time: preferredCallTime || null,
      active: active
    })
    .eq("id", residentId);
} else {
  query = supabaseClient
    .from("residents")
    .insert({
      first_name: firstName,
      last_name: lastName,
      phone_number: phoneNumber,
      preferred_call_time: preferredCallTime || null,
      active: active
    });
}

const { error } = await query;
    

    if (error) {
      console.error("Could not save resident:", error);
      message.textContent = error.message;
      return;
    }

    message.textContent = "";

    document.getElementById("residentForm").reset();
  document.getElementById("residentId").value = "";
document.getElementById("residentFormTitle").textContent = "Add Resident";
    document.getElementById("residentActive").checked = true;

    document
      .getElementById("residentFormPanel")
      .classList.remove("open");

    await loadResidents();
  });
startResidentsPage();
</script>
</body>
</html>
